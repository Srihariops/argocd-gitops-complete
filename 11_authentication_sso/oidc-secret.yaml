# ======================================================================
# FILE   : oidc-secret.yaml
# PURPOSE: Client secret for OIDC providers.
# APPLY  : kubectl apply -f oidc-secret.yaml
# ======================================================================
apiVersion: v1
kind: Secret
metadata:
  name: argocd-sso-secret
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  oidc.clientSecret: "<CLIENT_SECRET_FROM_PROVIDER>"
